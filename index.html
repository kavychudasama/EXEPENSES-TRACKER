<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================================================
   TOKENS
========================================================= */

:root{
  --bg: #08090c;
  --bg-elev-1: #0f1116;
  --bg-elev-2: #14161d;
  --bg-elev-3: #191c25;
  --border: #23262f;
  --border-soft: #1a1c24;

  --text-hi: #f4f5f7;
  --text-mid: #9a9fae;
  --text-low: #6b7080;

  --accent: #7c6bff;
  --accent-2: #a695ff;
  --accent-soft: rgba(124,107,255,0.14);

  --green: #34d399;
  --green-soft: rgba(52,211,153,0.14);
  --red: #fb7185;
  --red-soft: rgba(251,113,133,0.14);
  --amber: #fbbf24;

  --radius-lg: 18px;
  --radius-md: 13px;
  --radius-sm: 9px;

  --shadow-card: 0 1px 0 rgba(255,255,255,0.02) inset, 0 20px 40px -24px rgba(0,0,0,0.6);
  --ease: cubic-bezier(.22,.9,.32,1);
  --sidebar-end: #0b0c11;
}

body.theme-light{
  --bg: #eef0f4;
  --bg-elev-1: #ffffff;
  --bg-elev-2: #ffffff;
  --bg-elev-3: #f2f3f7;
  --border: #dfe2ea;
  --border-soft: #e8eaf0;

  --text-hi: #14161c;
  --text-mid: #565b6c;
  --text-low: #868b9c;

  --accent: #6a58f0;
  --accent-2: #8a7bf5;
  --accent-soft: rgba(106,88,240,0.12);

  --green: #17a374;
  --green-soft: rgba(23,163,116,0.12);
  --red: #e0435f;
  --red-soft: rgba(224,67,95,0.12);
  --amber: #d69a11;

  --shadow-card: 0 1px 0 rgba(255,255,255,0.6) inset, 0 20px 40px -28px rgba(20,22,28,0.18);
  --sidebar-end: #e2e5ec;
}

body,
.sidebar, .card, .week-box, .expense-box, .form-box, .day-expand-overlay,
.toast, .confirm-box, #chargingOverlay .core, .cat-option, .form-group input,
.form-group select, .search-box input, .menu button, .card-icon, .cat-icon{
  transition:background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
}

* { margin:0; padding:0; box-sizing:border-box; }

body{
  font-family:'Inter',Arial,sans-serif;
  background:
    radial-gradient(1100px 600px at 85% -10%, rgba(124,107,255,0.10), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(52,211,153,0.06), transparent 60%),
    var(--bg);
  color:var(--text-hi);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3{ font-family:'Sora','Inter',sans-serif; letter-spacing:-0.01em; }

::selection{ background:var(--accent-soft); color:var(--text-hi); }

::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:10px; }
::-webkit-scrollbar-thumb:hover{ background:var(--text-low); }

/* =========================================================
   LAYOUT
========================================================= */

.container{ display:flex; min-height:100vh; }

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  width:252px;
  background:linear-gradient(180deg, var(--bg-elev-1), var(--sidebar-end, #0b0c11));
  border-right:1px solid var(--border-soft);
  padding:28px 20px;
  flex-shrink:0;
  position:relative;
  z-index:10;
  display:flex;
  flex-direction:column;
  transition:background 0.4s ease, border-color 0.4s ease;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:'Sora',sans-serif;
  font-size:19px;
  font-weight:700;
  color:var(--text-hi);
  margin-bottom:6px;
  padding:0 6px;
}

.logo-mark{
  width:30px; height:30px;
  border-radius:9px;
  background:linear-gradient(135deg, var(--accent), #5647d9);
  display:flex; align-items:center; justify-content:center;
  font-size:15px;
  box-shadow:0 6px 16px -4px rgba(124,107,255,0.55);
  flex-shrink:0;
}

.logo-sub{
  font-size:11.5px;
  color:var(--text-low);
  padding:0 6px;
  margin-bottom:34px;
  letter-spacing:0.02em;
}

.menu{ display:flex; flex-direction:column; gap:4px; }

.menu button{
  display:flex;
  align-items:center;
  gap:11px;
  background:transparent;
  border:none;
  color:var(--text-mid);
  padding:11px 12px;
  border-radius:10px;
  text-align:left;
  font-size:14px;
  font-weight:500;
  font-family:inherit;
  cursor:pointer;
  transition:background 0.18s var(--ease), color 0.18s var(--ease);
  position:relative;
}

.menu button .ico{
  width:18px; text-align:center; font-size:15px; opacity:0.9;
}

.menu button:hover{ background:var(--bg-elev-3); color:var(--text-hi); }

.menu button.active{
  background:var(--accent-soft);
  color:var(--text-hi);
}

.menu button.active::before{
  content:"";
  position:absolute;
  left:-20px; top:50%; transform:translateY(-50%);
  width:3px; height:18px;
  border-radius:0 3px 3px 0;
  background:var(--accent);
}

.sidebar-footer{
  margin-top:auto;
  padding:14px 12px;
  border-radius:12px;
  background:var(--bg-elev-2);
  border:1px solid var(--border-soft);
}

.sidebar-footer p{ font-size:11.5px; color:var(--text-low); line-height:1.5; }
.sidebar-footer strong{ color:var(--text-mid); font-weight:600; }

/* =========================================================
   MAIN
========================================================= */

.main{ flex:1; padding:36px 42px 60px; min-width:0; position:relative; }

/* =========================================================
   HEADER
========================================================= */

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-bottom:28px;
  gap:20px;
}

.header h1{ font-size:27px; font-weight:700; margin-bottom:5px; }
.header p{ color:var(--text-mid); font-size:14px; }

.add-btn{
  background:linear-gradient(135deg, var(--accent), #6152e0);
  color:white;
  border:none;
  padding:11px 20px;
  border-radius:11px;
  cursor:pointer;
  font-weight:600;
  font-size:14px;
  font-family:inherit;
  display:flex; align-items:center; gap:7px;
  box-shadow:0 10px 24px -10px rgba(124,107,255,0.65);
  transition:transform 0.18s var(--ease), box-shadow 0.18s var(--ease), filter 0.18s;
  flex-shrink:0;
}

.add-btn:hover{ transform:translateY(-2px); box-shadow:0 14px 30px -10px rgba(124,107,255,0.8); filter:brightness(1.05); }
.add-btn:active{ transform:translateY(0); }

/* =========================================================
   CARDS
========================================================= */

.cards{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:16px;
  margin-bottom:20px;
}

.card{
  background:var(--bg-elev-2);
  border:1px solid var(--border-soft);
  padding:22px 22px 20px;
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
  transition:transform 0.22s var(--ease), border-color 0.22s var(--ease);
  position:relative;
  overflow:hidden;
}

.card::after{
  content:"";
  position:absolute; inset:0;
  background:linear-gradient(135deg, rgba(124,107,255,0.06), transparent 55%);
  opacity:0;
  transition:opacity 0.25s;
}

.card:hover{ transform:translateY(-3px); border-color:rgba(124,107,255,0.35); }
.card:hover::after{ opacity:1; }

.card-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }

.card h3{
  color:var(--text-low);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:0.08em;
  text-transform:uppercase;
}

.card-icon{
  width:32px; height:32px;
  border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-size:14px;
  flex-shrink:0;
}

.card-icon.clickable{
  cursor:pointer;
  transition:transform 0.2s var(--ease), filter 0.2s var(--ease), box-shadow 0.2s var(--ease);
}

.card-icon.clickable:hover{
  transform:scale(1.14) rotate(-6deg);
  filter:brightness(1.2);
  box-shadow:0 0 14px rgba(52,211,153,0.5);
}

.card-icon.clickable:active{ transform:scale(0.95) rotate(0deg); }

.today-spend-picker{
  position:absolute;
  top:52px;
  right:20px;
  z-index:20;
  display:none;
  background:var(--bg-elev-3);
  border:1px solid var(--border-soft);
  border-radius:12px;
  padding:10px;
  box-shadow:0 16px 34px -14px rgba(0,0,0,0.7);
  animation:pickerPop 0.2s var(--ease);
}

.today-spend-picker.open{ display:block; }

@keyframes pickerPop{
  from{ opacity:0; transform:translateY(-6px) scale(0.96); }
  to{ opacity:1; transform:translateY(0) scale(1); }
}

#todaySpendDateInput{
  background:var(--bg-elev-2);
  border:1px solid var(--border-soft);
  color:var(--text-hi);
  padding:8px 10px;
  border-radius:8px;
  font-family:inherit;
  font-size:13px;
  outline:none;
  color-scheme:dark;
}

#todaySpendDateInput:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}

.card p.amount-pop-replay{ animation:amountPop 0.4s cubic-bezier(.2,.9,.3,1.4); }

.card-reset-btn{
  font-size:11px;
  font-weight:600;
  color:var(--accent-2);
  cursor:pointer;
  margin-left:8px;
  padding:2px 8px;
  border-radius:100px;
  background:var(--accent-soft);
  vertical-align:middle;
  transition:background 0.18s var(--ease), color 0.18s var(--ease);
}

.card-reset-btn:hover{ background:rgba(124,107,255,0.28); color:var(--text-hi); }

.card p{ font-size:26px; font-weight:700; font-family:'Sora',sans-serif; letter-spacing:-0.01em; }

.card .trend{ font-size:12px; color:var(--text-low); margin-top:6px; display:flex; align-items:center; gap:5px; }
.card .trend.up{ color:var(--green); }
.card .trend.down{ color:var(--red); }

/* =========================================================
   WEEK / TREND BOX
========================================================= */

.week-box{
  background:var(--bg-elev-2);
  border:1px solid var(--border-soft);
  padding:24px 24px 20px;
  border-radius:var(--radius-lg);
  margin-bottom:20px;
  box-shadow:var(--shadow-card);
  transition:padding 0.35s var(--ease);
  width:100%;
  max-width:100%;
  position:relative;
  overflow:hidden;
}

.week-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:22px;
  gap:16px;
  flex-wrap:wrap;
}

.week-header-left{ display:flex; align-items:center; gap:12px; }

.week-header h2{ font-size:16px; font-weight:700; margin-bottom:4px; transition:color 0.2s; }
.week-header p{ color:var(--text-low); font-size:12.5px; }

.week-total-box{ text-align:right; }
.week-total-box .label{ font-size:11px; color:var(--text-low); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:3px; }
.week-total-box strong{ font-size:19px; font-family:'Sora',sans-serif; display:inline-block; }
.week-total-box strong.amount-pop-replay{ animation:amountPop 0.4s cubic-bezier(.2,.9,.3,1.4); }

@keyframes amountPop{
  0%{ opacity:0; transform:scale(0.7); }
  70%{ transform:scale(1.08); }
  100%{ opacity:1; transform:scale(1); }
}

/* =========================================================
   DAYS (3-week bar chart, horizontally scrollable)
========================================================= */

.days-scroll{
  overflow:hidden;
  padding-bottom:4px;
  transition:opacity 0.25s var(--ease), max-height 0.35s var(--ease);
}

.days{
  display:grid;
  grid-template-columns:repeat(7, 1fr);
  gap:32px;
  align-items:end;
  height:260px;
  width:100%;
  transition:transform 0.34s cubic-bezier(.22,1,.36,1), opacity 0.28s ease;
}

.days.week-anim-out-left{ transform:translateX(-28px); opacity:0; }
.days.week-anim-out-right{ transform:translateX(28px); opacity:0; }
.days.week-anim-pre-right{ transform:translateX(28px); opacity:0; transition:none; }
.days.week-anim-pre-left{ transform:translateX(-28px); opacity:0; transition:none; }

/* =========================================================
   WEEK PAGER (prev/next navigation, replaces scrollbar)
========================================================= */

.week-pager{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--border-soft);
}

.week-nav-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px; height:34px;
  border-radius:10px;
  background:var(--bg-elev-3);
  border:1px solid var(--border-soft);
  color:var(--text-mid);
  cursor:pointer;
  font-size:15px;
  flex-shrink:0;
  transition:transform 0.18s var(--ease), background 0.18s var(--ease), color 0.18s var(--ease), border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
}

.week-nav-btn:hover:not(:disabled){
  color:var(--text-hi);
  background:var(--accent-soft);
  border-color:rgba(124,107,255,0.45);
  box-shadow:0 0 14px rgba(124,107,255,0.35);
}

.week-nav-btn:active:not(:disabled){ transform:scale(0.9); }

.week-nav-btn.prev:hover:not(:disabled){ transform:translateX(-3px); }
.week-nav-btn.next:hover:not(:disabled){ transform:translateX(3px); }

.week-nav-btn:disabled{
  opacity:0.3;
  cursor:not-allowed;
}

.week-range-label{
  font-size:12.5px;
  color:var(--text-mid);
  font-weight:600;
  min-width:120px;
  text-align:center;
  transition:opacity 0.2s var(--ease);
}

.week-dots{
  display:flex;
  gap:6px;
  align-items:center;
}

.week-dot{
  width:6px; height:6px;
  border-radius:50%;
  background:var(--border);
  transition:background 0.25s var(--ease), transform 0.25s var(--ease), width 0.25s var(--ease);
  cursor:pointer;
}

.week-dot:hover{ background:var(--accent-2); }

.week-dot.active{
  background:var(--accent);
  width:16px;
  border-radius:4px;
  box-shadow:0 0 8px rgba(124,107,255,0.6);
}

/* =========================================================
   DAY EXPAND OVERLAY (bar grows to cover whole week-box)
========================================================= */

.days-scroll, .week-header, .week-pager{
  transition:opacity 0.3s var(--ease);
}

.day-expand-fade{
  opacity:0 !important;
  pointer-events:none;
}

.day-expand-overlay{
  position:absolute;
  display:none;
  opacity:0;
  z-index:5;
  overflow:hidden;
  box-shadow:0 20px 50px -20px rgba(0,0,0,0.7);
}

.day-expand-inner{
  padding:26px 26px 20px;
  height:100%;
  overflow-y:auto;
  opacity:0;
}

.day-expand-header{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:20px;
}

.day-expand-close{
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px; height:34px;
  border-radius:10px;
  background:var(--bg-elev-3);
  border:1px solid var(--border-soft);
  color:var(--text-mid);
  cursor:pointer;
  font-size:15px;
  flex-shrink:0;
  transition:transform 0.18s var(--ease), background 0.18s var(--ease), color 0.18s var(--ease), border-color 0.18s var(--ease);
}

.day-expand-close:hover{ color:var(--text-hi); border-color:rgba(124,107,255,0.35); background:var(--accent-soft); transform:translateX(-3px); }

.day-expand-title{ font-size:16px; font-weight:700; color:var(--text-hi); font-family:'Sora',sans-serif; }
.day-expand-sub{ font-size:12px; color:var(--text-low); margin-top:2px; }

.day-expand-total{
  margin-left:auto;
  text-align:right;
  font-size:19px;
  font-weight:700;
  font-family:'Sora',sans-serif;
  color:var(--text-hi);
}

.day-expand-empty{
  color:var(--text-low);
  font-size:13px;
  padding:30px 0;
  text-align:center;
}

.day-cat-row{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:16px;
  opacity:0;
  animation:rowSlideIn 0.45s var(--ease) forwards;
  animation-delay:calc(var(--row-index, 0) * 0.06s + 0.05s);
}

@keyframes rowSlideIn{
  from{ opacity:0; transform:translateX(-14px); }
  to{ opacity:1; transform:translateX(0); }
}

.day-cat-row .dc-icon{
  width:30px; height:30px;
  border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-size:13px;
  flex-shrink:0;
}

.day-cat-row .dc-label{ font-size:12.5px; color:var(--text-mid); width:90px; flex-shrink:0; }

.day-cat-row .dc-bar-track{
  flex:1;
  height:12px;
  background:var(--bg-elev-3);
  border-radius:6px;
  overflow:hidden;
}

.day-cat-row .dc-bar-fill{
  height:100%;
  border-radius:6px;
  width:0;
  transition:width 0.6s cubic-bezier(.22,1,.36,1);
}

.day-cat-row .dc-amount{ font-size:12.5px; font-weight:600; color:var(--text-hi); width:80px; text-align:right; flex-shrink:0; }

.day-expense-list{ margin-top:16px; border-top:1px solid var(--border-soft); padding-top:12px; }

.day-expense-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid var(--border-soft);
  font-size:13px;
  opacity:0;
  animation:rowSlideIn 0.4s var(--ease) forwards;
  animation-delay:calc(var(--row-index, 0) * 0.05s + 0.15s);
  transition:padding-left 0.2s var(--ease), background 0.2s var(--ease);
  border-radius:8px;
}
.day-expense-item:last-child{ border-bottom:none; }
.day-expense-item:hover{ padding-left:6px; background:var(--bg-elev-3); }

.day-expense-item .dei-icon{
  width:26px; height:26px;
  border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-size:12px;
  flex-shrink:0;
}

.day-expense-item .dei-note{ flex:1; color:var(--text-mid); }
.day-expense-item .dei-amount{ font-weight:600; color:var(--text-hi); }

.day{
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  gap:6px;
}

.bar-container{
  height:190px;
  width:100%;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.bar{
  width:38px;
  max-width:100%;
  min-height:4px;
  background:linear-gradient(180deg, var(--accent-2), var(--accent));
  border-radius:5px 5px 2px 2px;
  transition:transform 0.25s var(--ease), filter 0.25s var(--ease), width 0.25s var(--ease), box-shadow 0.3s var(--ease);
  position:relative;
  overflow:hidden;
  cursor:pointer;
  transform-origin:bottom center;
  animation:barGrowIn 0.7s var(--ease) backwards, barGlowPulse 2.6s ease-in-out infinite;
  animation-delay:var(--bar-delay, 0s), calc(var(--bar-delay, 0s) + 0.9s);
  box-shadow:0 0 0 rgba(124,107,255,0);
}

@keyframes barGrowIn{
  0%{ transform:scaleY(0); opacity:0; }
  55%{ transform:scaleY(1.06); opacity:1; }
  75%{ transform:scaleY(0.97); }
  100%{ transform:scaleY(1); opacity:1; }
}

@keyframes barGlowPulse{
  0%, 100%{ box-shadow:0 0 0 rgba(124,107,255,0); }
  50%{ box-shadow:0 0 10px rgba(124,107,255,0.35); }
}

.bar::before{
  content:"";
  position:absolute;
  inset:0;
  background:inherit;
  transform:translateX(-100%);
  animation:barColorSlide 0.7s var(--ease) forwards;
  animation-delay:var(--bar-delay, 0s);
}

.bar::after{
  content:"";
  position:absolute;
  top:0; left:-60%;
  width:40%; height:100%;
  background:linear-gradient(115deg, transparent, rgba(255,255,255,0.55), transparent);
  transform:skewX(-20deg);
  opacity:0;
  animation:barShine 1.1s ease-out forwards;
  animation-delay:calc(var(--bar-delay, 0s) + 0.35s);
}

@keyframes barColorSlide{
  from{ transform:translateX(-100%); }
  to{ transform:translateX(0); }
}

@keyframes barShine{
  0%{ left:-60%; opacity:0; }
  15%{ opacity:0.9; }
  60%{ opacity:0.5; }
  100%{ left:120%; opacity:0; }
}

.bar:hover{
  filter:brightness(1.25) saturate(1.15);
  transform:scaleX(1.18) scaleY(1.02);
  box-shadow:0 0 16px rgba(124,107,255,0.65);
}

.bar:active{ transform:scaleX(1.05) scaleY(0.96); }

.bar.today{
  background:linear-gradient(180deg, #6ee7b7, var(--green));
}

.day-name{ color:var(--text-low); font-size:9.5px; text-transform:uppercase; letter-spacing:0.03em; transition:color 0.25s var(--ease); }
.day-number{ font-weight:700; font-size:11px; color:var(--text-mid); transition:color 0.25s var(--ease), transform 0.25s var(--ease); }
.day-number.today{ color:var(--green); }

.day{ transition:transform 0.2s var(--ease); }
.day:hover{ transform:translateY(-2px); }
.day:hover .day-number{ transform:scale(1.08); }

/* =========================================================
   EXPENSE BOX
========================================================= */

.expense-box{
  background:var(--bg-elev-2);
  border:1px solid var(--border-soft);
  padding:22px 24px 8px;
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
}

.expense-box-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.expense-box h2{ font-size:16px; font-weight:700; }
.expense-count-tag{
  font-size:11.5px; color:var(--text-low); background:var(--bg-elev-3);
  padding:4px 10px; border-radius:100px; border:1px solid var(--border-soft);
}

/* =========================================================
   EXPENSE ROW
========================================================= */

.expense{
  display:grid;
  grid-template-columns:auto 1fr auto auto;
  align-items:center;
  gap:16px;
  padding:16px 0;
  border-bottom:1px solid var(--border-soft);
  animation:expenseAppear 0.4s var(--ease);
}

.expense:last-child{ border-bottom:none; }

@keyframes expenseAppear{
  from{ opacity:0; transform:translateY(8px); }
  to{ opacity:1; transform:translateY(0); }
}

.cat-icon{
  width:38px; height:38px;
  border-radius:11px;
  background:var(--bg-elev-3);
  border:1px solid var(--border-soft);
  display:flex; align-items:center; justify-content:center;
  font-size:16px;
  flex-shrink:0;
}

.expense-info h3{ font-size:14.5px; font-weight:600; margin-bottom:3px; }
.expense-info p{ color:var(--text-low); font-size:12.5px; }

.expense-date{ color:var(--text-low); font-size:12px; white-space:nowrap; }

.amount{ color:var(--text-hi); font-weight:700; font-family:'Sora',sans-serif; margin-bottom:8px; text-align:right; font-size:14.5px; }

.actions{ display:flex; gap:6px; }

.edit-btn, .delete-btn{
  background:var(--bg-elev-3);
  color:var(--text-mid);
  border:1px solid var(--border-soft);
  width:32px; height:32px;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
  display:flex; align-items:center; justify-content:center;
  transition:0.18s var(--ease);
}

.edit-btn:hover{ background:var(--accent-soft); color:var(--accent-2); border-color:rgba(124,107,255,0.35); }
.delete-btn:hover{ background:var(--red-soft); color:var(--red); border-color:rgba(251,113,133,0.35); }

/* =========================================================
   FORM
========================================================= */

.form-box{
  max-width:640px;
  background:var(--bg-elev-2);
  border:1px solid var(--border-soft);
  padding:32px;
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
}

.form-box h2{ margin-bottom:26px; font-size:18px; font-weight:700; }

.form-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }

.form-group{ margin-bottom:18px; }

.form-group label{
  display:block;
  color:var(--text-mid);
  font-size:12.5px;
  font-weight:600;
  margin-bottom:8px;
  letter-spacing:0.01em;
}

.category-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:8px;
  margin-bottom:18px;
}

.cat-option{
  background:var(--bg-elev-3);
  border:1px solid var(--border-soft);
  color:var(--text-mid);
  padding:12px 8px;
  border-radius:10px;
  cursor:pointer;
  text-align:center;
  font-size:12.5px;
  font-weight:500;
  transition:0.16s var(--ease);
  display:flex; flex-direction:column; align-items:center; gap:5px;
}

.cat-option .emo{ font-size:17px; }

.cat-option:hover{ border-color:rgba(124,107,255,0.35); color:var(--text-hi); }

.cat-option.selected{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--text-hi);
}

.form-group input,
.form-group select{
  width:100%;
  background:var(--bg-elev-3);
  border:1px solid var(--border-soft);
  color:var(--text-hi);
  padding:12px 14px;
  border-radius:10px;
  outline:none;
  font-family:inherit;
  font-size:14px;
  transition:border-color 0.18s, box-shadow 0.18s;
}

.form-group input::placeholder{ color:var(--text-low); }

.form-group input:focus,
.form-group select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}

.amount-input-wrap{ position:relative; }
.amount-input-wrap .prefix{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  color:var(--text-low); font-size:14px; pointer-events:none;
}
.amount-input-wrap input{ padding-left:28px; }

.form-actions{ display:flex; gap:10px; margin-top:8px; }

.save-btn{
  background:linear-gradient(135deg, var(--accent), #6152e0);
  color:white;
  border:none;
  padding:12px 22px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  font-size:14px;
  font-family:inherit;
  box-shadow:0 10px 24px -10px rgba(124,107,255,0.65);
  transition:transform 0.18s var(--ease), filter 0.18s;
}
.save-btn:hover{ transform:translateY(-2px); filter:brightness(1.05); }

.cancel-btn{
  background:var(--bg-elev-3);
  color:var(--text-mid);
  border:1px solid var(--border-soft);
  padding:12px 20px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  font-size:14px;
  font-family:inherit;
  transition:0.18s var(--ease);
}
.cancel-btn:hover{ color:var(--text-hi); border-color:#333748; }

/* =========================================================
   SEARCH + FILTER BAR
========================================================= */

.search-box{ margin-bottom:18px; display:flex; gap:10px; }

.search-box input{
  flex:1;
  background:var(--bg-elev-3);
  border:1px solid var(--border-soft);
  color:var(--text-hi);
  padding:12px 14px 12px 40px;
  border-radius:10px;
  outline:none;
  font-family:inherit;
  font-size:14px;
}

.search-box input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

.search-wrap{ position:relative; flex:1; }
.search-wrap .sicon{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  color:var(--text-low); font-size:14px; pointer-events:none;
}

/* =========================================================
   EMPTY STATE
========================================================= */

.empty{
  color:var(--text-low);
  text-align:center;
  padding:56px 20px;
  font-size:14px;
}
.empty .empty-ico{ font-size:30px; margin-bottom:12px; opacity:0.6; }

/* =========================================================
   TOAST
========================================================= */

#toastRoot{
  position:fixed;
  bottom:26px; right:26px;
  display:flex; flex-direction:column; gap:10px;
  z-index:10000;
}

.toast{
  background:var(--bg-elev-3);
  border:1px solid var(--border-soft);
  color:var(--text-hi);
  padding:13px 18px;
  border-radius:11px;
  font-size:13.5px;
  font-weight:500;
  display:flex; align-items:center; gap:10px;
  box-shadow:0 20px 40px -16px rgba(0,0,0,0.7);
  animation:toastIn 0.3s var(--ease);
  min-width:220px;
}

.toast.success{ border-color:rgba(52,211,153,0.35); }
.toast.error{ border-color:rgba(251,113,133,0.35); }

.toast .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.toast.success .dot{ background:var(--green); box-shadow:0 0 8px var(--green); }
.toast.error .dot{ background:var(--red); box-shadow:0 0 8px var(--red); }

@keyframes toastIn{
  from{ opacity:0; transform:translateY(10px) scale(0.96); }
  to{ opacity:1; transform:translateY(0) scale(1); }
}
@keyframes toastOut{
  from{ opacity:1; transform:translateY(0); }
  to{ opacity:0; transform:translateY(6px); }
}

/* =========================================================
   CONFIRM MODAL
========================================================= */

#confirmOverlay{
  position:fixed; inset:0;
  background:rgba(4,5,8,0.7);
  backdrop-filter:blur(4px);
  display:none;
  align-items:center; justify-content:center;
  z-index:9998;
}
#confirmOverlay.active{ display:flex; animation:overlayIn 0.2s ease; }

.confirm-box{
  background:var(--bg-elev-2);
  border:1px solid var(--border-soft);
  border-radius:16px;
  padding:26px;
  max-width:360px;
  width:90%;
  box-shadow:0 30px 60px -20px rgba(0,0,0,0.8);
  animation:confirmIn 0.25s var(--ease);
}

@keyframes confirmIn{
  from{ opacity:0; transform:scale(0.94) translateY(6px); }
  to{ opacity:1; transform:scale(1) translateY(0); }
}

.confirm-box h3{ font-size:16px; margin-bottom:8px; }
.confirm-box p{ color:var(--text-mid); font-size:13.5px; line-height:1.5; margin-bottom:20px; }
.confirm-actions{ display:flex; gap:10px; justify-content:flex-end; }

.confirm-delete-btn{
  background:var(--red);
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:9px;
  cursor:pointer;
  font-weight:600;
  font-size:13.5px;
  font-family:inherit;
}
.confirm-delete-btn:hover{ filter:brightness(1.1); }

/* =========================================================
   =========================================================
   CHARGING CORE
   =========================================================
========================================================= */

#chargingOverlay{
  position:fixed; inset:0;
  background:radial-gradient(circle at center, rgba(20,22,30,0.97), rgba(4,5,8,0.99));
  display:none;
  justify-content:center; align-items:center;
  z-index:9999;
  overflow:hidden;
}

#chargingOverlay.active{ display:flex; animation:overlayIn 0.35s ease; }

@keyframes overlayIn{ from{opacity:0;} to{opacity:1;} }

.energy-beam{
  position:absolute; bottom:-120px;
  width:7px; height:55vh;
  border-radius:999px;
  background:linear-gradient(to top, transparent, var(--accent), var(--accent-2), white);
  filter:blur(1px);
  box-shadow:0 0 8px var(--accent), 0 0 20px var(--accent), 0 0 50px rgba(124,107,255,0.8);
  transform:translateY(120%);
  opacity:0;
}

#chargingOverlay.active .energy-beam{ animation:beamRise 1.3s cubic-bezier(.2,.8,.2,1) forwards; }

@keyframes beamRise{
  0%{ transform:translateY(120%); opacity:0; }
  20%{ opacity:1; }
  70%{ opacity:1; }
  100%{ transform:translateY(-8%); opacity:1; }
}

.energy-particles{ position:absolute; bottom:0; width:100%; height:100%; pointer-events:none; }

.particle{
  position:absolute; left:50%; bottom:0;
  width:3px; height:3px;
  background:white;
  border-radius:50%;
  box-shadow:0 0 10px var(--accent-2);
  opacity:0;
}

#chargingOverlay.active .particle{
  animation:particleRise var(--duration) ease-out infinite;
  animation-delay:var(--delay);
}

@keyframes particleRise{
  0%{ transform:translate(var(--x), 40px) scale(0.4); opacity:0; }
  20%{ opacity:1; }
  100%{ transform:translate(var(--x), -70vh) scale(1.2); opacity:0; }
}

.core-wrapper{
  position:relative;
  width:270px; height:270px;
  display:flex; justify-content:center; align-items:center;
  transform:scale(0.65);
  opacity:0;
}

#chargingOverlay.active .core-wrapper{ animation:coreEnter 0.8s 0.6s cubic-bezier(.2,.9,.2,1) forwards; }

@keyframes coreEnter{
  0%{ transform:scale(0.65); opacity:0; }
  70%{ transform:scale(1.08); opacity:1; }
  100%{ transform:scale(1); opacity:1; }
}

.core-ring{ position:absolute; border-radius:50%; border:2px solid transparent; }

.ring-one{
  width:260px; height:260px;
  border-top-color:var(--accent);
  border-right-color:var(--accent-2);
  box-shadow:0 0 15px rgba(124,107,255,0.8);
  animation:rotateRing 4s linear infinite;
}

.ring-two{
  width:226px; height:226px;
  border-bottom-color:var(--green);
  border-left-color:var(--accent);
  box-shadow:0 0 15px rgba(52,211,153,0.5);
  animation:rotateRingReverse 3s linear infinite;
}

.ring-three{
  width:198px; height:198px;
  border-top-color:var(--accent-2);
  border-right-color:var(--accent);
  animation:rotateRing 2.2s linear infinite;
}

@keyframes rotateRing{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
@keyframes rotateRingReverse{ from{transform:rotate(360deg);} to{transform:rotate(0deg);} }

.core{
  width:150px; height:150px;
  border-radius:50%;
  background:radial-gradient(circle, #1c212c 0%, #10131a 58%, #0a0c11 100%);
  border:2px solid var(--accent);
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  position:relative; z-index:5;
  box-shadow:0 0 20px rgba(124,107,255,0.7), 0 0 50px rgba(124,107,255,0.45), inset 0 0 35px rgba(124,107,255,0.2);
}

#chargingOverlay.active .core{ animation:corePulse 1.2s 1.2s ease-in-out infinite alternate; }

@keyframes corePulse{
  from{ box-shadow:0 0 20px rgba(124,107,255,0.7), 0 0 50px rgba(124,107,255,0.4), inset 0 0 25px rgba(124,107,255,0.15); }
  to{ box-shadow:0 0 30px rgba(124,107,255,0.95), 0 0 80px rgba(124,107,255,0.65), inset 0 0 45px rgba(124,107,255,0.35); }
}

.core-money{
  font-family:'Sora',sans-serif;
  font-size:25px;
  font-weight:800;
  color:white;
  text-shadow:0 0 10px rgba(255,255,255,0.5);
  opacity:0;
  transform:translateY(12px) scale(0.8);
}

#chargingOverlay.active .core-money{ animation:moneyAppear 0.65s 1.4s cubic-bezier(.2,.9,.2,1) forwards; }

@keyframes moneyAppear{
  0%{ opacity:0; transform:translateY(12px) scale(0.8); }
  60%{ opacity:1; transform:translateY(-3px) scale(1.08); }
  100%{ opacity:1; transform:translateY(0) scale(1); }
}

.core-category{ margin-top:5px; color:var(--text-mid); font-size:12.5px; opacity:0; }

#chargingOverlay.active .core-category{ animation:textAppear 0.5s 1.65s ease forwards; }

@keyframes textAppear{ from{opacity:0;} to{opacity:1;} }

.core-status{
  position:absolute; bottom:-42px;
  color:var(--text-low);
  font-size:11.5px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  opacity:0;
}

#chargingOverlay.active .core-status{ animation:textAppear 0.5s 1.25s ease forwards; }

.success-flash{
  position:absolute;
  width:40px; height:40px;
  border-radius:50%;
  border:2px solid white;
  opacity:0;
  transform:scale(0);
}

#chargingOverlay.active .success-flash{ animation:successFlash 0.7s 2.15s ease-out forwards; }

@keyframes successFlash{
  0%{ opacity:0.9; transform:scale(0); }
  100%{ opacity:0; transform:scale(8); }
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width: 980px){
  .container{ flex-direction:column; }
  .sidebar{ width:100%; border-right:none; border-bottom:1px solid var(--border-soft); flex-direction:row; align-items:center; padding:16px 20px; }
  .logo-sub{ display:none; }
  .logo{ margin-bottom:0; }
  .menu{ flex-direction:row; margin-left:auto; }
  .sidebar-footer{ display:none; }
  .cards{ grid-template-columns:1fr 1fr; }
  .main{ padding:22px; }
}

@media(max-width: 650px){
  .header{ flex-direction:column; align-items:flex-start; }
  .cards{ grid-template-columns:1fr; }
  .expense{ grid-template-columns:auto 1fr; row-gap:10px; }
  .expense-date{ order:3; }
  .amount{ order:4; text-align:left; margin-bottom:0; }
  .actions{ order:5; }
  .form-row{ grid-template-columns:1fr; }
  .category-grid{ grid-template-columns:repeat(2, 1fr); }
  .core-wrapper{ transform:scale(0.75); }
  .menu button span.label{ display:none; }
  .days{ gap:10px; height:200px; }
  .bar{ width:24px; }
  .bar-container{ height:145px; }
}

</style>
</head>


<body>

<div id="chargingOverlay">
  <div class="energy-beam"></div>
  <div class="energy-particles">
    <div class="particle" style="--x:-25px; --duration:1.8s; --delay:0s;"></div>
    <div class="particle" style="--x:18px; --duration:2.1s; --delay:0.2s;"></div>
    <div class="particle" style="--x:-12px; --duration:1.6s; --delay:0.4s;"></div>
    <div class="particle" style="--x:32px; --duration:2.3s; --delay:0.7s;"></div>
    <div class="particle" style="--x:-35px; --duration:1.9s; --delay:0.9s;"></div>
    <div class="particle" style="--x:8px; --duration:2.4s; --delay:1.1s;"></div>
    <div class="particle" style="--x:-45px; --duration:2.0s; --delay:1.3s;"></div>
    <div class="particle" style="--x:43px; --duration:1.7s; --delay:1.5s;"></div>
  </div>
  <div class="core-wrapper">
    <div class="core-ring ring-one"></div>
    <div class="core-ring ring-two"></div>
    <div class="core-ring ring-three"></div>
    <div class="core">
      <div class="core-money" id="chargingAmount">₹0.00</div>
      <div class="core-category" id="chargingCategory">Expense</div>
    </div>
    <div class="core-status">Expense Flow • Saving</div>
    <div class="success-flash"></div>
  </div>
</div>

<div id="confirmOverlay">
  <div class="confirm-box">
    <h3 id="confirmTitle">Delete this expense?</h3>
    <p id="confirmBody">This action can't be undone.</p>
    <div class="confirm-actions">
      <button class="cancel-btn" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-delete-btn" id="confirmActionBtn">Delete</button>
    </div>
  </div>
</div>

<div id="toastRoot"></div>

<div class="container">

<aside class="sidebar">
  <div class="logo">
    <div class="logo-mark">◆</div>
    <span class="label">Expense Flow</span>
  </div>
  <div class="logo-sub">Personal finance, 2026</div>

  <div class="menu">
    <button onclick="showDashboard()" data-nav="dashboard"><span class="ico">🏠</span><span class="label">Dashboard</span></button>
    <button onclick="showAddExpense()" data-nav="add"><span class="ico">➕</span><span class="label">Add Expense</span></button>
    <button onclick="showExpenses()" data-nav="list"><span class="ico">📋</span><span class="label">View Expenses</span></button>
    <button onclick="toggleTheme()" id="themeToggleBtn"><span class="ico" id="themeToggleIcon">🌙</span><span class="label" id="themeToggleLabel">Dark Mode</span></button>
  </div>

  <div class="sidebar-footer">
    <p><strong>Tip.</strong> Click any bar to see that day's spending broken down by category.</p>
  </div>
</aside>

<main class="main">
  <div class="header">
    <div>
      <h1 id="pageTitle">Dashboard</h1>
      <p id="pageSubtitle">Your personal finance overview.</p>
    </div>
    <button class="add-btn" onclick="showAddExpense()">
      <span>＋</span> Add Expense
    </button>
  </div>

  <div id="content"></div>
</main>

</div>


<script>

/* =========================================================
   GLOBAL
========================================================= */

let expenses = [];

/* =========================================================
   THEME (light / dark)
========================================================= */

function applyTheme(theme){
  document.body.classList.toggle("theme-light", theme === "light");

  const icon = document.getElementById("themeToggleIcon");
  const label = document.getElementById("themeToggleLabel");

  if(theme === "light"){
    if(icon) icon.innerText = "☀️";
    if(label) label.innerText = "Light Mode";
  } else {
    if(icon) icon.innerText = "🌙";
    if(label) label.innerText = "Dark Mode";
  }

  try{ localStorage.setItem("expenseFlowTheme", theme); }
  catch(error){ /* storage unavailable, theme just won't persist */ }
}

function toggleTheme(){
  const current = document.body.classList.contains("theme-light") ? "light" : "dark";
  applyTheme(current === "light" ? "dark" : "light");
}

function loadSavedTheme(){
  let saved = "dark";
  try{ saved = localStorage.getItem("expenseFlowTheme") || "dark"; }
  catch(error){ /* storage unavailable, default to dark */ }
  applyTheme(saved);
}

const CATEGORY_META = {
  Food:          { emo:"🍔", color:"#fbbf24", bg:"rgba(251,191,36,0.14)" },
  Transport:     { emo:"🚌", color:"#60a5fa", bg:"rgba(96,165,250,0.14)" },
  Shopping:      { emo:"🛍",  color:"#f472b6", bg:"rgba(244,114,182,0.14)" },
  Bills:         { emo:"🧾", color:"#a78bfa", bg:"rgba(167,139,250,0.14)" },
  Education:     { emo:"📚", color:"#34d399", bg:"rgba(52,211,153,0.14)" },
  Entertainment: { emo:"🎮", color:"#fb7185", bg:"rgba(251,113,133,0.14)" },
  Health:        { emo:"💊", color:"#38bdf8", bg:"rgba(56,189,248,0.14)" },
  Travel:        { emo:"✈️", color:"#facc15", bg:"rgba(250,204,21,0.14)" },
  Other:         { emo:"📦", color:"#9ca3af", bg:"rgba(156,163,175,0.14)" }
};

let selectedCategory = "Food";
let selectedEditCategory = "Food";

/* =========================================================
   NAV ACTIVE STATE
========================================================= */

function setActiveNav(key){
  document.querySelectorAll(".menu button").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.nav === key);
  });
}

/* =========================================================
   TOAST
========================================================= */

function showToast(message, type = "success"){
  const root = document.getElementById("toastRoot");
  const toast = document.createElement("div");
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span class="dot"></span><span>${escapeHTML(message)}</span>`;
  root.appendChild(toast);

/* =========================================================
   MONEY
========================================================= */

function formatMoney(amount){
  return "₹" + Number(amount).toLocaleString("en-IN", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

/* =========================================================
   TODAY
========================================================= */

function getToday(){
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const day = String(now.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

========================================================= */

function getCategoryCount(){
  const categories = [];
  for(const expense of expenses){
    if(!categories.includes(expense.category)){
      categories.push(expense.category);
    }
  }
  return categories.length;
}

/* =========================================================
   3 WEEKS DATA -> PAGINATED WEEKLY VIEW
========================================================= */

let weekDaysAll = [];   // 21 days, oldest -> newest
let currentWeekPage = 2; // 0 = 2 weeks ago, 1 = last week, 2 = this week
let weekAnimBusy = false;

const WEEK_PAGE_LABELS = ["2 Weeks Ago", "Last Week", "This Week"];

async function loadWeeksData(){
  try{
    const response = await fetch("/expenses/3weeks");
    const data = await response.json();

    if(!data || !Array.isArray(data.days)) return;

    weekDaysAll = data.days;
    currentWeekPage = 2; // default to the most recent week

    renderWeekPage("none");
  }
  catch(error){
    console.error("3 week chart error:", error);
  }
}

function getPageDays(page){
  const start = page * 7;
  return weekDaysAll.slice(start, start + 7);
}

function formatRangeLabel(days){
  if(!days || days.length === 0) return "—";
  const first = days[0];
  const last = days[days.length - 1];
  const firstMonth = new Date(first.date + "T00:00:00").toLocaleDateString("en-GB", { month: "short" });
  const lastMonth = new Date(last.date + "T00:00:00").toLocaleDateString("en-GB", { month: "short" });
  if(firstMonth === lastMonth){
    return `${first.day_number} – ${last.day_number} ${lastMonth}`;
  }
  return `${first.day_number} ${firstMonth} – ${last.day_number} ${lastMonth}`;
}

function buildBarsHTML(days){
  let max = Math.max(...days.map(day => Number(day.total)));
  if(max === 0) max = 1;

  const today = getToday();

  return days.map((day, index) => {
    const height = day.total === 0 ? 4 : Math.max(6, (day.total / max) * 100);
    const isToday = day.date === today;

    return `
      <div class="day" title="${day.day}, ${day.day_number} — ${formatMoney(day.total)}">
        <div class="bar-container">
          <div class="bar ${isToday ? 'today' : ''}" style="height:${height}%; --bar-delay:${index * 0.04}s;" onclick="handleBarClick(event, '${day.date}')"></div>
        </div>
        <div class="day-name">${day.day}</div>
        <div class="day-number ${isToday ? 'today' : ''}">${day.day_number}</div>
      </div>
    `;
  }).join("");
}

function renderDots(){
  const dotsContainer = document.getElementById("weekDots");
  if(!dotsContainer) return;

  dotsContainer.innerHTML = "";

  for(let i = 0; i < 3; i++){
    const dot = document.createElement("div");
    dot.className = "week-dot" + (i === currentWeekPage ? " active" : "");
    dot.onclick = () => jumpToWeek(i);
    dotsContainer.appendChild(dot);
  }
}

function updateHeaderForPage(){
  const headerTitle = document.getElementById("weekHeaderTitle");
  const headerSubtitle = document.getElementById("weekHeaderSubtitle");
  const rangeLabel = document.getElementById("weekRangeLabel");
  const weekTotal = document.getElementById("weekTotal");
  const weekTotalLabel = document.getElementById("weekTotalLabel");
  const prevBtn = document.getElementById("prevWeekBtn");
  const nextBtn = document.getElementById("nextWeekBtn");

  const pageDays = getPageDays(currentWeekPage);
  const pageTotal = pageDays.reduce((sum, day) => sum + Number(day.total), 0);

  if(headerTitle) headerTitle.innerText = WEEK_PAGE_LABELS[currentWeekPage];
  if(headerSubtitle) headerSubtitle.innerText = "Your daily spending activity";
  if(rangeLabel) rangeLabel.innerText = formatRangeLabel(pageDays);
  if(weekTotalLabel) weekTotalLabel.innerText = "Total spent";

  if(weekTotal){
    weekTotal.innerText = formatMoney(pageTotal);
    weekTotal.classList.remove("amount-pop-replay");
    void weekTotal.offsetWidth;
    weekTotal.classList.add("amount-pop-replay");
  }

  if(prevBtn) prevBtn.disabled = (currentWeekPage === 0);
  if(nextBtn) nextBtn.disabled = (currentWeekPage === 2);

  renderDots();
}

function renderWeekPage(direction){
  const container = document.getElementById("weekDays");
  if(!container) return;

  const pageDays = getPageDays(currentWeekPage);
  container.innerHTML = buildBarsHTML(pageDays);

  updateHeaderForPage();
}

/* =========================================================
   WEEK NAVIGATION (prev / next / jump, with slide transition)
========================================================= */

function navigateWeek(targetPage, exitDirection){
  if(weekAnimBusy) return;
  if(targetPage < 0 || targetPage > 2) return;
  if(targetPage === currentWeekPage) return;

  weekAnimBusy = true;

  const container = document.getElementById("weekDays");
  const prevBtn = document.getElementById("prevWeekBtn");
  const nextBtn = document.getElementById("nextWeekBtn");
  if(prevBtn) prevBtn.disabled = true;
  if(nextBtn) nextBtn.disabled = true;

  const outClass = exitDirection === "next" ? "week-anim-out-left" : "week-anim-out-right";
  const preClass = exitDirection === "next" ? "week-anim-pre-right" : "week-anim-pre-left";

  container.classList.add(outClass);

  setTimeout(() => {
    currentWeekPage = targetPage;

    const pageDays = getPageDays(currentWeekPage);
    container.innerHTML = buildBarsHTML(pageDays);

    container.classList.remove(outClass);
    container.classList.add(preClass);

    // force reflow so the browser registers the pre-position before transitioning
    void container.offsetWidth;

    requestAnimationFrame(() => {
      container.classList.remove(preClass);
    });

    updateHeaderForPage();

    setTimeout(() => {
      weekAnimBusy = false;
    }, 360);

  }, 300);
}

function nextWeek(){
  navigateWeek(currentWeekPage + 1, "next");
}

function prevWeek(){
  navigateWeek(currentWeekPage - 1, "prev");
}

function jumpToWeek(page){
  if(page === currentWeekPage) return;
  navigateWeek(page, page > currentWeekPage ? "next" : "prev");
}

/* =========================================================
   DAY EXPAND (clicked bar grows to cover the whole week-box)
========================================================= */

let dayExpandBusy = false;
let dayExpandDate = null;
let dayExpandOriginRect = null;

function handleBarClick(event, date){
  event.stopPropagation();

  if(dayExpandBusy) return;

  if(dayExpandDate === date){
    collapseDayExpand();
    return;
  }

  if(dayExpandDate) return; // a day is already expanded

  expandDayFromBar(event.currentTarget, date);
}

function expandDayFromBar(barEl, date){
  dayExpandBusy = true;
  dayExpandDate = date;

  const weekBox = document.getElementById("weekBox");
  const overlay = document.getElementById("dayExpandOverlay");
  const inner = document.getElementById("dayExpandInner");
  const weekHeader = document.getElementById("weekHeader");
  const daysScroll = document.getElementById("daysScroll");
  const weekPager = document.getElementById("weekPager");

  const boxRect = weekBox.getBoundingClientRect();
  const barRect = barEl.getBoundingClientRect();

  const startLeft = barRect.left - boxRect.left;
  const startTop = barRect.top - boxRect.top;
  const startWidth = barRect.width;
  const startHeight = barRect.height;

  dayExpandOriginRect = { left: startLeft, top: startTop, width: startWidth, height: startHeight };

  // fade the chart & header out of the way
  weekHeader.classList.add("day-expand-fade");
  daysScroll.classList.add("day-expand-fade");
  weekPager.classList.add("day-expand-fade");

  // snap overlay to the clicked bar's exact position, no transition yet
  overlay.style.transition = "none";
  overlay.style.left = startLeft + "px";
  overlay.style.top = startTop + "px";
  overlay.style.width = startWidth + "px";
  overlay.style.height = startHeight + "px";
  overlay.style.borderRadius = "5px 5px 2px 2px";
  overlay.style.backgroundImage = "linear-gradient(180deg, var(--accent-2), var(--accent))";
  overlay.style.backgroundColor = "";
  overlay.style.display = "block";
  overlay.style.opacity = "1";
  overlay.style.pointerEvents = "auto";
  inner.style.transition = "none";
  inner.style.opacity = "0";
  inner.innerHTML = "";

  void overlay.offsetWidth; // force reflow so the snap applies before animating

  requestAnimationFrame(() => {
    overlay.style.transition = "left 0.5s cubic-bezier(.22,1,.36,1), top 0.5s cubic-bezier(.22,1,.36,1), width 0.5s cubic-bezier(.22,1,.36,1), height 0.5s cubic-bezier(.22,1,.36,1), border-radius 0.5s cubic-bezier(.22,1,.36,1), background-color 0.45s ease 0.15s, background-image 0.45s ease 0.15s";
    overlay.style.left = "0px";
    overlay.style.top = "0px";
    overlay.style.width = boxRect.width + "px";
    overlay.style.height = boxRect.height + "px";
    overlay.style.borderRadius = getComputedStyle(weekBox).borderRadius;
    overlay.style.backgroundImage = "none";
    overlay.style.backgroundColor = "var(--bg-elev-3)";
  });

  setTimeout(async () => {
    inner.style.transition = "opacity 0.35s ease";
    inner.style.opacity = "1";
    await loadDayDetailInto(inner, date);
    dayExpandBusy = false;
  }, 560);
}

async function loadDayDetailInto(inner, date){
  inner.innerHTML = `<div class="day-expand-empty">Loading day details…</div>`;

  try{
    const response = await fetch(`/analytics/day/${date}`);
    const data = await response.json();

    if(!response.ok){
      inner.innerHTML = `<div class="day-expand-empty">Could not load this day.</div>`;
      return;
    }

    const headerHTML = `
      <div class="day-expand-header">
        <button class="day-expand-close" onclick="collapseDayExpand()" title="Back to week view">←</button>
        <div>
          <div class="day-expand-title">${data.formatted_date}</div>
          <div class="day-expand-sub">${data.count} expense${data.count === 1 ? "" : "s"}</div>
        </div>
        <div class="day-expand-total">${formatMoney(data.total)}</div>
      </div>
    `;

    if(data.count === 0){
      inner.innerHTML = headerHTML + `<div class="day-expand-empty">No expenses recorded on this day.</div>`;
      return;
    }

    let maxCatTotal = Math.max(...data.categories.map(c => c.total));
    if(maxCatTotal === 0) maxCatTotal = 1;

    const catRowsHTML = data.categories
      .sort((a, b) => b.total - a.total)
      .map((cat, i) => {
        const meta = categoryMeta(cat.category);
        const pct = Math.max(4, (cat.total / maxCatTotal) * 100);
        return `
          <div class="day-cat-row" style="--row-index:${i};">
            <div class="dc-icon" style="background:${meta.bg}; color:${meta.color};">${meta.emo}</div>
            <div class="dc-label">${escapeHTML(cat.category)}</div>
            <div class="dc-bar-track">
              <div class="dc-bar-fill" data-target-width="${pct}" style="width:0%; background:${meta.color};"></div>
            </div>
            <div class="dc-amount">${formatMoney(cat.total)}</div>
          </div>
        `;
      }).join("");

    const expenseItemsHTML = data.expenses
      .map((exp, i) => {
        const meta = categoryMeta(exp.category);
        return `
          <div class="day-expense-item" style="--row-index:${i};">
            <div class="dei-icon" style="background:${meta.bg}; color:${meta.color};">${meta.emo}</div>
            <div class="dei-note">${escapeHTML(exp.note || exp.category)}</div>
            <div class="dei-amount">${formatMoney(exp.amount)}</div>
          </div>
        `;
      }).join("");

    inner.innerHTML = headerHTML + catRowsHTML + `<div class="day-expense-list">${expenseItemsHTML}</div>`;

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        inner.querySelectorAll(".dc-bar-fill").forEach(fill => {
          fill.style.width = fill.dataset.targetWidth + "%";
        });
      });
    });

  }
  catch(error){
    console.error("Day detail error:", error);
    inner.innerHTML = `<div class="day-expand-empty">Something went wrong loading this day.</div>`;
  }
}

function collapseDayExpand(){
  if(dayExpandBusy || !dayExpandDate) return;
  dayExpandBusy = true;

  const overlay = document.getElementById("dayExpandOverlay");
  const inner = document.getElementById("dayExpandInner");
  const weekHeader = document.getElementById("weekHeader");
  const daysScroll = document.getElementById("daysScroll");
  const weekPager = document.getElementById("weekPager");

  inner.style.opacity = "0";

  setTimeout(() => {
    if(dayExpandOriginRect){
      overlay.style.transition = "left 0.45s cubic-bezier(.22,1,.36,1), top 0.45s cubic-bezier(.22,1,.36,1), width 0.45s cubic-bezier(.22,1,.36,1), height 0.45s cubic-bezier(.22,1,.36,1), border-radius 0.45s cubic-bezier(.22,1,.36,1), background-color 0.3s ease, background-image 0.3s ease 0.15s";
      overlay.style.left = dayExpandOriginRect.left + "px";
      overlay.style.top = dayExpandOriginRect.top + "px";
      overlay.style.width = dayExpandOriginRect.width + "px";
      overlay.style.height = dayExpandOriginRect.height + "px";
      overlay.style.borderRadius = "5px 5px 2px 2px";
      overlay.style.backgroundColor = "";
      overlay.style.backgroundImage = "linear-gradient(180deg, var(--accent-2), var(--accent))";
    }

    weekHeader.classList.remove("day-expand-fade");
    daysScroll.classList.remove("day-expand-fade");
    weekPager.classList.remove("day-expand-fade");

    setTimeout(() => {
      overlay.style.opacity = "0";
      overlay.style.pointerEvents = "none";

      setTimeout(() => {
        overlay.style.display = "none";
        inner.innerHTML = "";
        dayExpandDate = null;
        dayExpandOriginRect = null;
        dayExpandBusy = false;
      }, 260);
    }, 460);
  }, 200);
}

  const note = document.getElementById("note").value.trim();

  if(amount === "" || Number(amount) <= 0){
    showToast("Please enter a valid amount.", "error");
    return;
  }

  if(date === ""){
    showToast("Please select a date.", "error");
    return;
  }

  if(date > getToday()){
    showToast("Future dates are not allowed.", "error");
    return;
  }

  const response = await fetch("/expenses", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ category, amount, date, note })
  });

  const result = await response.json();

  if(!response.ok){
    showToast(result.error || "Could not add expense.", "error");
    return;
  }

  startChargingAnimation(result.amount, result.category);

  setTimeout(() => {
    showDashboard();
  }, 3300);
}

/* =========================================================
   EDIT EXPENSE
========================================================= */

async function editExpense(id){
  setActiveNav("list");
  await loadExpenses();

  const expense = expenses.find(item => item.id === id);

  if(!expense){
    showToast("Expense not found.", "error");
    return;
  }

  selectedEditCategory = expense.category;

  document.getElementById("pageTitle").innerText = "Edit Expense";
  document.getElementById("pageSubtitle").innerText = "Update your transaction.";

  document.getElementById("content").innerHTML = `
    <div class="form-box">
      <h2>Edit Expense #${expense.id}</h2>

      <div class="form-group">
        <label>Category</label>
        <div class="category-grid" id="editCategoryGrid"></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Amount</label>
          <div class="amount-input-wrap">
            <span class="prefix">₹</span>
            <input type="number" id="editAmount" value="${expense.amount}" min="0" step="0.01">
          </div>
        </div>

        <div class="form-group">
          <label>Date</label>
          <input type="date" id="editDate" value="${expense.date}" max="${getToday()}">
        </div>
      </div>

      <div class="form-group">
        <label>Note</label>
        <input type="text" id="editNote" value="${escapeAttribute(expense.note || "")}">
      </div>

      <div class="form-actions">
        <button class="save-btn" onclick="saveEditedExpense(${expense.id})">💾 Save Changes</button>
        <button class="cancel-btn" onclick="showExpenses()">Cancel</button>
      </div>
    </div>
  `;

  renderCategoryGrid("editCategoryGrid", selectedEditCategory, (cat)=>{ selectedEditCategory = cat; });
}

/* =========================================================
   SAVE EDIT
========================================================= */

async function saveEditedExpense(id){
  const category = selectedEditCategory;
  const amount = document.getElementById("editAmount").value;
  const date = document.getElementById("editDate").value;
  const note = document.getElementById("editNote").value.trim();

  if(amount === "" || Number(amount) <= 0){
    showToast("Enter a valid amount.", "error");
    return;
  }

  if(date === ""){
    showToast("Please select a date.", "error");
    return;
  }

  if(date > getToday()){
    showToast("Future dates are not allowed.", "error");
    return;
  }

  const response = await fetch(`/expenses/${id}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ category, amount, date, note })
  });

  const result = await response.json();

  if(!response.ok){
    showToast(result.error || "Could not update expense.", "error");
    return;
  }

  showToast("Expense updated successfully.", "success");
  showExpenses();
}

/* =========================================================
   DELETE EXPENSE
========================================================= */

async function deleteExpense(id){
  await loadExpenses();

  const expense = expenses.find(item => item.id === id);

  if(!expense){
    showToast("Expense not found.", "error");
    return;
  }

  openConfirm(
    "Delete this expense?",
    `${expense.category} — ${formatMoney(expense.amount)}`,
    async () => {
      const response = await fetch(`/expenses/${id}`, { method: "DELETE" });
      const result = await response.json();

      if(!response.ok){
        showToast(result.error || "Could not delete expense.", "error");
        return;
      }

      showToast("Expense deleted.", "success");
      showExpenses();
    }
  );
}

/* =========================================================
   VIEW EXPENSES
========================================================= */

async function showExpenses(){
  setActiveNav("list");
  await loadExpenses();

  document.getElementById("pageTitle").innerText = "View Expenses";
  document.getElementById("pageSubtitle").innerText = "Manage all your transactions.";

  document.getElementById("content").innerHTML = `
    <div class="expense-box">
      <div class="expense-box-header">
        <h2>All Expenses</h2>
        <span class="expense-count-tag" id="allCountTag">${expenses.length} total</span>
      </div>

      <div class="search-box">
        <div class="search-wrap">
          <span class="sicon">🔍</span>
          <input type="text" id="searchInput" placeholder="Search category or note…" oninput="searchExpenses()">
        </div>
      </div>

      <div id="expenseList"></div>
    </div>
  `;

  displayAllExpenses();
}

/* =========================================================
   DISPLAY ALL
========================================================= */

function displayAllExpenses(){
  const list = document.getElementById("expenseList");

  if(expenses.length === 0){
    list.innerHTML = `
      <div class="empty">
        <div class="empty-ico">🗂️</div>
        No expenses found.
      </div>
    `;
    return;
  }

  list.innerHTML = "";

  const sorted = [...expenses].sort((a, b) => b.date.localeCompare(a.date));

  for(const expense of sorted){
    list.innerHTML += createExpenseHTML(expense);
  }
}

/* =========================================================
   CREATE EXPENSE HTML
========================================================= */

function createExpenseHTML(expense){
  const meta = categoryMeta(expense.category);

  return `
    <div class="expense">
      <div class="cat-icon" style="background:${meta.bg}; color:${meta.color};">${meta.emo}</div>

      <div class="expense-info">
        <h3>${escapeHTML(expense.category)}</h3>
        <p>${escapeHTML(expense.note || "No note")}</p>
      </div>

      <div class="expense-date">${expense.date}</div>

      <div>
        <div class="amount">${formatMoney(expense.amount)}</div>
        <div class="actions">
          <button class="edit-btn" onclick="editExpense(${expense.id})" title="Edit">✏️</button>
          <button class="delete-btn" onclick="deleteExpense(${expense.id})" title="Delete">🗑️</button>
        </div>
      </div>
    </div>
  `;
}

/* =========================================================
   SEARCH
========================================================= */

function searchExpenses(){
  const search = document.getElementById("searchInput").value.toLowerCase();
  const list = document.getElementById("expenseList");

  const filtered = expenses.filter(expense =>
    (expense.category || "").toLowerCase().includes(search) ||
    (expense.note || "").toLowerCase().includes(search) ||
    (expense.date || "").includes(search)
  );

  if(filtered.length === 0){
    list.innerHTML = `
      <div class="empty">
        <div class="empty-ico">🔍</div>
        No expenses match "${escapeHTML(search)}".
      </div>
    `;
    return;
  }

  list.innerHTML = "";

  const sorted = [...filtered].sort((a, b) => b.date.localeCompare(a.date));

  for(const expense of sorted){
    list.innerHTML += createExpenseHTML(expense);
  }
}

/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(text){
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function escapeAttribute(text){
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll('"', "&quot;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}
